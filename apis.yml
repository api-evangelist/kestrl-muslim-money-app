aid: kestrl-muslim-money-app
name: 'Kestrl: Muslim Money App'
description: 'Kestrl is a UK-based, FCA-regulated ethical fintech offering a values-aligned
  money app for Muslim and ethically-minded consumers. In partnership with Maybank Islamic,
  it provides interest-free (Sharia-compliant) banking, a Mastercard debit card with values
  filtering, goal-based sub-accounts, interest purification and Zakat calculation, transaction
  monitoring that alerts users to payments toward ethically questionable companies, and
  security features such as card freezing and biometric authentication. Kestrl is a consumer
  mobile application on iOS and Android; it does not currently publish a public developer
  API, SDK, or developer portal. This profile was surfaced as a Techstars portfolio company
  and enriched from public web sources.'
